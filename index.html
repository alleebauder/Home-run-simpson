<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Bauder Home</title>
  <meta name="description" content="A home command center for iPad: what's next for the family, and whether the house is okay.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bauder Home">
  <meta name="theme-color" content="#08110f">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wall" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar" id="top"></header>
    <nav class="modes" id="modes" aria-label="One-tap modes"></nav>
    <main class="home" id="home" aria-label="Home screen"></main>
    <nav class="dock" id="dock" aria-label="Apps"></nav>
  </div>

  <div class="pop" id="pop" role="menu" aria-label="Profiles" hidden></div>
  <section class="sheet" id="sheet" aria-modal="true" role="dialog" hidden></section>
  <section class="idle" id="idle" aria-label="Clock face. Tap to return to the home screen." hidden></section>
  <div class="overlay" id="alarm" hidden></div>
  <div class="overlay" id="bell" hidden></div>
  <div class="overlay" id="hazard" hidden></div>
  <div class="overlay" id="pin" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:24px">Bauder Home needs JavaScript turned on in Safari.</p></noscript>
  <script src="app.js" defer></script>
</body>
</html>
