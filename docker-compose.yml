# Bauder Home on Umbrel.
# Deploy with Portainer from the Umbrel App Store (Stacks → Add stack → Repository),
# or from a terminal with: docker compose up -d --build
# Then open http://umbrel.local:8686 on the iPad.
services:
  bauder-home:
    build:
      context: .
      dockerfile: umbrel/Dockerfile
    container_name: bauder-home
    ports:
      - "8686:80"
    volumes:
      # Optional. A file here is served at /data/ and does not replace feed/bauder-hq.json.
      - bauder-home-data:/usr/share/nginx/html/data
    restart: unless-stopped

volumes:
  bauder-home-data:
