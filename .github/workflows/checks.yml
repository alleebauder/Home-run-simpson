name: Bauder Home checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bauder-home-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Syntax and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check recipes-library.js
          node --check sw.js
          node --check test/countdown.test.mjs
          node --check test/recipes-library.test.mjs
          node --check test/tesla.test.mjs

      - name: Run unit tests
        run: node --test test/*.test.mjs
