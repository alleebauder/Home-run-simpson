server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location ~* \.webmanifest$ {
    types { }
    default_type application/manifest+json;
  }

  # Always fetch the newest app files and service worker.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /app.js { add_header Cache-Control "no-cache"; }
  location = /recipes-library.js { add_header Cache-Control "no-cache"; }
  location = /styles.css { add_header Cache-Control "no-cache"; }

  # Bauder HQ feed files. Drop bauder-hq.json into the mounted data folder.
  location /data/ {
    add_header Cache-Control "no-store";
    add_header Access-Control-Allow-Origin "*";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
