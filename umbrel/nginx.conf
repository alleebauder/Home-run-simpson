server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location ~* \.webmanifest$ {
    types { }
    default_type application/manifest+json;
  }

  # Always fetch the newest app files and service worker.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /app.js { add_header Cache-Control "no-cache"; }
  location = /household.js { add_header Cache-Control "no-cache"; }
  location = /styles.css { add_header Cache-Control "no-cache"; }
  location = /household.json {
    add_header Cache-Control "no-cache";
    add_header Access-Control-Allow-Origin "*";
  }

  # Repo feed. Kept outside /data so the Umbrel volume does not hide it.
  location /feed/ {
    add_header Cache-Control "no-store";
    add_header Access-Control-Allow-Origin "*";
  }

  # Optional feed drop-in. Put bauder-hq.json in the mounted data folder.
  location /data/ {
    add_header Cache-Control "no-store";
    add_header Access-Control-Allow-Origin "*";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
